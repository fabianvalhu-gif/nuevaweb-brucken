<svg width="1600" height="1100" viewBox="0 0 1600 1100" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Paisaje de montaña abstracto</title>
  <desc id="desc">Ilustración con degradado y siluetas de montañas para usar como imagen destacada</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="70%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#60a5fa" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="mount1" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="mount2" x1="1" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="mount3" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="1100" fill="url(#sky)"/>
  <circle cx="1250" cy="220" r="140" fill="url(#sun)" opacity="0.8"/>
  <path d="M0 760 L320 540 L620 760 Z" fill="url(#mount3)" opacity="0.8"/>
  <path d="M200 800 L620 460 L980 800 Z" fill="url(#mount2)" opacity="0.9"/>
  <path d="M520 850 L1040 420 L1480 850 Z" fill="url(#mount1)" opacity="0.95"/>
  <path d="M0 900 L400 720 L800 940 L1200 760 L1600 900 L1600 1100 L0 1100 Z" fill="#0b1021"/>
</svg>
